<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Award Portal Demo Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        @import url('https://fonts.maateen.me/solaiman-lipi/font.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #ffffff 0%, #e0f6ff 40%, #7cd7ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            font-family: 'Montserrat', sans-serif;
        }

        .mobile-container {
            width: 100%;
            max-width: 450px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }

        .header h1 {
            font-size: 20px;
            font-weight: bold;
            color: #059669;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .header h2 {
            font-size: 14px;
            font-weight: normal;
            color: #333333;
        }

        .badge {
            display: inline-block;
            background-color: #0ea5e9;
            color: white;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.4);
            text-transform: uppercase;
        }

        .cards-area {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 15px; 
            width: 100%;
            margin-bottom: 40px;
        }

        .card-wrapper {
            width: calc(50% - 10px); 
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-top-title {
            font-family: 'SolaimanLipi', sans-serif;
            font-size: 16px; 
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 10px;
            text-align: center;
            min-height: 48px; 
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            width: 100%;
            padding: 0 5px;
        }

        .card {
            width: 100%;
            max-width: 180px;
            aspect-ratio: 3 / 4;
            border-radius: 15px;
            position: relative;
            background-color: #1783f2;
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 20px rgba(0, 80, 150, 0.15), inset 0 0 0 1px rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .corner-borders {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1.5px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            z-index: 5;
        }

        .watermark {
            position: absolute;
            font-size: 50px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            z-index: 2;
            top: 10px; left: -5px;
        }

        .card-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 65%;
            background: linear-gradient(to top, rgba(12, 110, 219, 1) 0%, rgba(23, 131, 242, 0.7) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 15px;
            z-index: 10;
        }

        /* 🌟 Perfect Round Icon Box 🌟 */
        .icon-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            width: 38px; /* Fixed width */
            height: 38px; /* Fixed height */
            border-radius: 50%; /* Perfect circle */
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-box svg { width: 18px; height: 18px; stroke: white; }

        .card-title {
            font-size: 16px;
            font-weight: 900;
            color: white;
            margin-bottom: 5px;
        }

        .click-text {
            font-size: 9px;
            font-weight: 700;
            background: white;
            color: #0c6edb;
            padding: 4px 12px;
            border-radius: 15px;
            text-transform: uppercase;
        }

        .original-site-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: auto;
            min-width: 220px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            border: 3px solid rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 20px rgba(4, 120, 87, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .original-site-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(4, 120, 87, 0.4);
        }

        .original-site-btn svg { width: 14px; height: 14px; stroke: white; }

    </style>
</head>
<body>

    <div class="mobile-container">
        
        <div class="header">
            <h1>ইয়ুথ অ্যাওয়ার্ড ওয়েব পোর্টাল ব্যবস্থাপনা টাস্ক ফোর্স</h1>
            <h2>বাংলাদেশ স্কাউটস প্রোগ্রাম বিভাগ</h2>
            <div class="badge">Demo</div>
        </div>

        <div class="cards-area">
            
            <div class="card-wrapper">
                <div class="card-top-title">রেজিস্ট্রেশন পদ্ধতি</div>
                <a href="guitar_photos/reg_process.png" target="_blank" class="card" style="background-image: url('guitar_photos/preview_reg.webp');">
                    <div class="corner-borders"></div>
                    <div class="watermark">01</div>
                    <div class="card-overlay">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        </div>
                        <div class="card-title">PNG</div>
                        <div class="click-text">Open</div>
                    </div>
                </a>
            </div>

            <div class="card-wrapper">
                <div class="card-top-title">অ্যাওয়ার্ড আবেদন পদ্ধতি</div>
                <a href="guitar_photos/apply_process.png" target="_blank" class="card" style="background-image: url('guitar_photos/preview_apply.webp');">
                    <div class="corner-borders"></div>
                    <div class="watermark">02</div>
                    <div class="card-overlay">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        </div>
                        <div class="card-title">PNG</div>
                        <div class="click-text">Open</div>
                    </div>
                </a>
            </div>

            <div class="card-wrapper">
                <div class="card-top-title">গ্রুপ রেজিস্ট্রেশন</div>
                <a href="guitar_photos/group_reg.png" target="_blank" class="card" style="background-image: url('guitar_photos/preview_group.webp');">
                    <div class="corner-borders"></div>
                    <div class="watermark">03</div>
                    <div class="card-overlay">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        </div>
                        <div class="card-title">PNG</div>
                        <div class="click-text">Open</div>
                    </div>
                </a>
            </div>

            <div class="card-wrapper">
                <div class="card-top-title">আসছে....</div>
                <a href="guitar_photos/others.png" target="_blank" class="card" style="background-image: url('guitar_photos/preview_others.webp');">
                    <div class="corner-borders"></div>
                    <div class="watermark">04</div>
                    <div class="card-overlay">
                        <div class="icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        </div>
                        <div class="card-title">PNG</div>
                        <div class="click-text">Open</div>
                    </div>
                </a>
            </div>

        </div>

        <a href="https://award.scouts.gov.bd" target="_blank" class="original-site-btn">
            <span>Now Go to Original</span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>

    </div>

</body>
</html>
